# Shelly Pro 3EM - polled directly over its local HTTP RPC API for live
# per-phase current. Its MQTT status pushes are too infrequent (~a minute)
# for load balancing, and that cadence isn't configurable on the device, so
# we poll it instead - much faster and fully under our control.
shelly:
  # LAN IP (or hostname) of the Shelly Pro 3EM, no scheme/port - just what
  # goes in front of "/rpc/EM.GetStatus".
  host: "10.30.0.55"
  # How often to fetch a fresh reading. The device responds in ~25ms
  # locally so this can be pushed low; the balancer's own cycle
  # (defa.poll_interval_seconds below) is what actually gates how often a
  # new value can be acted on and written to the station.
  poll_interval_seconds: 1
  # A reading older than this is treated as no data at all: the balancer
  # stops writing eMS max current AND stops sending the alive heartbeat,
  # so DEFA's own alive-timeout mechanism takes over and drops to
  # fallback_current_a rather than us silently reusing a stale value.
  # Defaults to max(5, poll_interval_seconds * 5) if omitted.
  max_age_seconds: 5

# DEFA Power charging stations (Modbus TCP). Multiple chargers are
# supported: `stations` order sets priority, first = highest. Only the
# first station always tries to start; each later one only joins in once
# the one ahead of it is enabled but not actually drawing power (idle) -
# so a single shared budget gets used by whichever charger actually has a
# car plugged in, instead of splitting it upfront across all of them.
defa:
  # How often the main loop re-reads every station and re-evaluates the
  # allocation. Also gates how often eMS max current actually gets rewritten,
  # regardless of how fast shelly.poll_interval_seconds delivers new data.
  poll_interval_seconds: 2
  # Must be comfortably below alive_timeout_seconds, so a normal cycle or
  # two of jitter never accidentally triggers the fallback.
  alive_interval_seconds: 3
  # Current each station falls back to if `alive` goes stale (this process
  # crashes, loses network, etc). Written to register 2004 on startup.
  fallback_current_a: 6
  # How long each station waits without a fresh `alive` write before
  # dropping to fallback_current_a. Written to register 2012 on startup.
  alive_timeout_seconds: 10
  # Below this actual current, a station counts as idle (not using its
  # allocation), making room for the next-priority station to start.
  idle_threshold_a: 1
  # If combined actual draw across enabled stations ever exceeds the
  # allocated ceiling (e.g. two ramp up at once), the lowest-priority one
  # of them is forced off; this is the minimum time between successive
  # forced shutdowns, so each gets a chance to take effect first.
  shutdown_stagger_seconds: 5
  # Where the *live* charger list is persisted once the dashboard's settings
  # menu is used to add/remove one (path relative to the working directory).
  # Kept separate from this file so a runtime change never rewrites
  # config.yaml's comments/formatting. Created automatically on first run.
  chargers_file: "state/chargers.yaml"
  # Seed list, only used the very first time this process runs (i.e. before
  # chargers_file exists). After that, chargers_file is the source of truth
  # and this is ignored - manage chargers from the dashboard instead.
  stations:
    # Label shown in logs and the dashboard - purely cosmetic.
    - name: "Charger 1"
      # LAN IP (or hostname) of the DEFA Power station's Modbus TCP interface.
      host: "10.30.0.200"
      # Modbus TCP port - 502 is the standard default, DEFA doesn't change it.
      port: 502
      # Modbus unit/device id. DEFA stations ship with 255 (broadcast/"don't
      # care") unless it's been reconfigured for a multi-unit setup.
      unit_id: 255
    # - name: "Charger 2"
    #   host: "10.30.0.xx"
    #   port: 502
    #   unit_id: 255

# Read-only live dashboard, served from inside this same process (reads
# the balancer's in-memory state directly - no extra Modbus/Shelly polling,
# and never a second writer). LAN-only by default: 0.0.0.0 makes it
# reachable from other devices on your network, but nothing proxies it to
# the internet unless you deliberately set that up separately.
web:
  # Turns the dashboard on/off. When false, none of the other web.* settings
  # have any effect and nothing is served.
  enabled: true
  # Interface to bind. "0.0.0.0" = reachable from any device on the LAN;
  # use "127.0.0.1" to restrict it to this machine only.
  host: "0.0.0.0"
  # TCP port the dashboard listens on.
  port: 8080
  # Required to use the dashboard's settings menu (add/remove chargers).
  # Sent back as the X-Settings-Token header. Leave blank to disable the
  # settings menu entirely - the dashboard stays read-only.
  settings_token: "legendary"

balancer:
  # Main fuse rating per phase, in amps. This is the hard limit the balancer
  # protects - set it to what your installation's incomer is actually rated for.
  fuse_limit_a: 25
  # Most EVs can't modulate below ~6A and will stop charging if asked to.
  min_charge_current_a: 6
  # Extra buffer subtracted from the computed headroom.
  safety_margin_a: 1
  # true  -> Shelly CTs are on the main incomer, so its reading already
  #          includes what the EV itself is drawing (must subtract it back out).
  # false -> Shelly CTs are on a separate circuit and never see the EV load.
  shelly_measures_whole_house: true
  # Output current is rounded down to a multiple of this many amps.
  step_a: 1
  # An increase in charge current only takes effect once the higher value
  # has been the continuously-computed target for this many seconds, so a
  # brief dip in house load doesn't bump the EV up and back down right
  # after. Decreases (safety) always apply immediately, no hold.
  increase_hold_seconds: 5
